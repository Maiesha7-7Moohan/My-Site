    <main class="main-container">
      <h2>Wanna Get In Touch?</h2>
      <div class="contact-grid">
        <div class="contact-card">
          <div class="contact-icon">✉</div>
          <h3>Email Me</h3>
          <p>
            <a href="mailto:maieshamoohan@gmail.com">maieshamoohan@gmail.com</a>
          </p>
        </div>

        <div class="contact-card">
          <div class="contact-icon">[in]</div>
          <h3>LinkedIn</h3>
          <p>
            <a href="https://linkedin.com/in/maiesha-moohan" target="_blank"
              >linkedin.com/in/maiesha-moohan</a
            >
          </p>
        </div>

        <div class="contact-card">
          <div class="contact-icon">⚒</div>
          <h3>GitHub</h3>
          <p>
            <a href="https://github.com/Maiesha7-7Moohan" target="_blank"
              >github.com/Maiesha7-7Moohan</a
            >
          </p>
        </div>
      </div>

      <div class="form-container">
        <h3>Want to send me a Message Directly?</h3>
        <form
          action="https://formspree.io/f/mrednoqy"
          method="POST"
          class="contact-form"
        >
          <div class="form-group">
            <label for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              required
              placeholder="Your Name"
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="Your Email Address"
            />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              rows="5"
              required
              placeholder="Write your message here..."
            ></textarea>
          </div>

          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </div>
    </main>
